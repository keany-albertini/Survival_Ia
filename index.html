<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Everwild Survival Prototype</title>
<style>
:root{--glass:rgba(13,20,16,.64);--text:#f4f3ea;--muted:#c5ccb9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d2b22;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:var(--glass);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.11);box-shadow:0 8px 28px rgba(0,0,0,.20)}#stats{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;width:min(43vw,180px);padding:7px 8px;border-radius:12px}.stat{display:grid;grid-template-columns:15px 1fr 27px;gap:5px;align-items:center;margin:4px 0;font-size:10px;color:var(--muted)}.bar{height:5px;background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px}#inv{position:absolute;top:max(8px,env(safe-area-inset-top));right:8px;display:flex;gap:5px;padding:6px;border-radius:12px}.slot{min-width:36px;padding:4px 5px;text-align:center;border-radius:9px;background:rgba(255,255,255,.07);font-size:9px;color:var(--muted)}.slot b{display:block;color:#fff;font-size:11px;margin-top:1px}#msg{position:absolute;left:50%;top:12%;transform:translateX(-50%);padding:6px 10px;border-radius:12px;background:rgba(0,0,0,.36);font-size:11px;opacity:0;transition:.2s;white-space:nowrap}#hint{position:absolute;left:50%;bottom:93px;transform:translateX(-50%);font-size:10px;color:#f6f2df;text-shadow:0 2px 4px #0008;white-space:nowrap}.pad{position:absolute;left:14px;bottom:max(14px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:rgba(10,18,13,.22);border:1px solid rgba(255,255,255,.12);pointer-events:auto;touch-action:none}.knob{position:absolute;width:46px;height:46px;left:33px;top:33px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);box-shadow:0 4px 14px #0004}.actions{position:absolute;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:52px 52px;gap:9px;pointer-events:auto}.btn{height:52px;border:none;border-radius:50%;color:#fff;background:rgba(20,30,23,.64);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);font-weight:700;font-size:10px;box-shadow:0 5px 15px #0004;touch-action:manipulation}.btn:active{transform:scale(.95);background:rgba(255,255,255,.18)}#eat{grid-column:1/3;width:58px;height:34px;border-radius:12px;justify-self:end}#title{position:absolute;left:50%;top:max(9px,env(safe-area-inset-top));transform:translateX(-50%);font-size:11px;font-weight:750;letter-spacing:.9px;text-shadow:0 2px 6px #0008;opacity:.92}
</style></head><body>
<canvas id="c"></canvas><div id="hud"><div id="title">EVERWILD • SURVIVAL TEST</div><div id="stats" class="panel"><div class="stat"><span>❤</span><div class="bar"><div id="hp" class="fill" style="background:#d66f62;width:100%"></div></div><b id="hpv">100</b></div><div class="stat"><span>🍖</span><div class="bar"><div id="food" class="fill" style="background:#d9aa58;width:100%"></div></div><b id="foodv">100</b></div><div class="stat"><span>💧</span><div class="bar"><div id="water" class="fill" style="background:#5cb7c9;width:100%"></div></div><b id="waterv">100</b></div></div><div id="inv" class="panel"><div class="slot">Bois<b id="wood">0</b></div><div class="slot">Pierre<b id="stone">0</b></div><div class="slot">Baies<b id="berries">0</b></div><div class="slot">Cristal<b id="crystal">0</b></div></div><div id="msg"></div><div id="hint">Approche-toi d'une ressource puis utilise RÉCOLTER</div></div><div id="touch"><div id="pad" class="pad"><div id="knob" class="knob"></div></div><div class="actions"><button id="gather" class="btn">RÉCOLTER</button><button id="attack" class="btn">ATTAQUE</button><button id="eat" class="btn">MANGER +15</button></div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const world={w:2100,h:1500};const player={x:1050,y:780,r:15,speed:185,hp:100,food:100,water:100,wood:0,stone:0,berries:0,crystal:0,dir:0,hit:0};const keys={};onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;const props=[],enemies=[],particles=[];function addProp(type,x,y,r){props.push({type,x,y,r,amount:type==='crystal'?2:3,flash:0})}for(let i=0;i<85;i++)addProp('tree',rand(60,2040),rand(60,1440),rand(17,26));for(let i=0;i<55;i++)addProp('rock',rand(60,2040),rand(60,1440),rand(12,20));for(let i=0;i<35;i++)addProp('berry',rand(60,2040),rand(60,1440),rand(10,14));for(let i=0;i<12;i++)addProp('crystal',rand(100,2000),rand(100,1400),rand(10,15));for(let i=0;i<13;i++)enemies.push({x:rand(120,1980),y:rand(120,1380),r:15,hp:35,vx:0,vy:0,ang:rand(0,6.28),t:rand(0,3),hurt:0});let joy={x:0,y:0,active:false,id:null};const pad=document.getElementById('pad'),knob=document.getElementById('knob');function joySet(e){const r=pad.getBoundingClientRect(),t=[...e.touches].find(t=>t.identifier===joy.id)||e.changedTouches[0];let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy),max=r.width*.33;if(m>max){dx=dx/m*max;dy=dy/m*max}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}pad.addEventListener('touchstart',e=>{e.preventDefault();joy.active=true;joy.id=e.changedTouches[0].identifier;joySet(e)},{passive:false});pad.addEventListener('touchmove',e=>{e.preventDefault();joySet(e)},{passive:false});function joyEnd(e){if([...e.changedTouches].some(t=>t.identifier===joy.id)){joy.active=false;joy.x=joy.y=0;joy.id=null;knob.style.transform=''}}pad.addEventListener('touchend',joyEnd);pad.addEventListener('touchcancel',joyEnd);let msgTimer=0;function msg(t){let m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;msgTimer=1.4}function nearest(max=64){let best=null,bd=max;for(const p of props){if(p.amount<=0)continue;let d=Math.hypot(p.x-player.x,p.y-player.y);if(d<bd){bd=d;best=p}}return best}function gather(){let p=nearest();if(!p)return msg('Aucune ressource assez proche');p.amount--;p.flash=1;if(p.type==='tree'){player.wood+=2;msg('+2 bois')}if(p.type==='rock'){player.stone+=2;msg('+2 pierre')}if(p.type==='berry'){player.berries+=2;msg('+2 baies')}if(p.type==='crystal'){player.crystal++;msg('+1 cristal ancien ✦')}for(let i=0;i<7;i++)particles.push({x:p.x,y:p.y,vx:rand(-35,35),vy:rand(-45,10),life:.6,type:p.type})}function attack(){player.hit=.18;let hit=false;for(const e of enemies){let d=Math.hypot(e.x-player.x,e.y-player.y);if(d<58&&e.hp>0){e.hp-=18;e.hurt=.18;hit=true;for(let i=0;i<5;i++)particles.push({x:e.x,y:e.y,vx:rand(-50,50),vy:rand(-50,20),life:.45,type:'hit'})}}if(!hit)msg('Coup dans le vide')}function eat(){if(player.berries>0){player.berries--;player.food=clamp(player.food+15,0,100);msg('Tu manges des baies +15 faim')}else msg('Tu n’as pas de baies')}document.getElementById('gather').onclick=gather;document.getElementById('attack').onclick=attack;document.getElementById('eat').onclick=eat;let last=performance.now();function update(t){let dt=Math.min(.033,(t-last)/1000);last=t;let dx=(keys['d']||keys['arrowright']?1:0)-(keys['q']||keys['a']||keys['arrowleft']?1:0),dy=(keys['s']||keys['arrowdown']?1:0)-(keys['z']||keys['w']||keys['arrowup']?1:0);if(joy.active){dx+=joy.x;dy+=joy.y}let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}if(Math.hypot(dx,dy)>.05)player.dir=Math.atan2(dy,dx);player.x=clamp(player.x+dx*player.speed*dt,20,world.w-20);player.y=clamp(player.y+dy*player.speed*dt,20,world.h-20);player.food=clamp(player.food-dt*.45,0,100);player.water=clamp(player.water-dt*.65,0,100);if(player.food<=0||player.water<=0)player.hp=clamp(player.hp-dt*2,0,100);if(keys['e']){keys['e']=0;gather()}if(keys[' ']){keys[' ']=0;attack()}player.hit=Math.max(0,player.hit-dt);for(const p of props)p.flash=Math.max(0,p.flash-dt*4);for(const e of enemies){if(e.hp<=0)continue;e.t-=dt;e.hurt=Math.max(0,e.hurt-dt);let d=Math.hypot(player.x-e.x,player.y-e.y);if(d<180){let a=Math.atan2(player.y-e.y,player.x-e.x);e.vx=Math.cos(a)*72;e.vy=Math.sin(a)*72;e.ang=a}else if(e.t<=0){e.t=rand(1,3);e.ang+=rand(-1.4,1.4);e.vx=Math.cos(e.ang)*28;e.vy=Math.sin(e.ang)*28}e.x=clamp(e.x+e.vx*dt,20,world.w-20);e.y=clamp(e.y+e.vy*dt,20,world.h-20);if(d<30)player.hp=clamp(player.hp-dt*7,0,100)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;if(p.life<=0)particles.splice(i,1)}msgTimer-=dt;if(msgTimer<0)document.getElementById('msg').style.opacity=0;document.getElementById('hp').style.width=player.hp+'%';document.getElementById('food').style.width=player.food+'%';document.getElementById('water').style.width=player.water+'%';document.getElementById('hpv').textContent=Math.ceil(player.hp);document.getElementById('foodv').textContent=Math.ceil(player.food);document.getElementById('waterv').textContent=Math.ceil(player.water);['wood','stone','berries','crystal'].forEach(k=>document.getElementById(k).textContent=player[k]);if(player.hp<=0){player.hp=100;player.food=65;player.water=65;player.x=1050;player.y=780;msg('Tu as été vaincu — retour au camp')}draw();requestAnimationFrame(update)}function draw(){const cam={x:clamp(player.x-W/2,0,world.w-W),y:clamp(player.y-H/2,0,world.h-H)};let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#71865a');g.addColorStop(.55,'#647b4d');g.addColorStop(1,'#536c45');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);for(let y=0;y<world.h;y+=180)for(let x=0;x<world.w;x+=180){let n=Math.sin(x*.013+y*.009)*.5+.5;ctx.fillStyle=`rgba(${n>.52?'102,120,76':'83,103,65'},.10)`;ctx.beginPath();ctx.ellipse(x+90,y+90,110,72,(x+y)*.001,0,6.28);ctx.fill()}ctx.fillStyle='rgba(67,132,145,.72)';ctx.beginPath();ctx.ellipse(1550,430,230,135,-.22,0,6.28);ctx.fill();ctx.strokeStyle='rgba(205,239,235,.25)';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#7b6346';ctx.beginPath();ctx.arc(1040,760,28,0,6.28);ctx.fill();ctx.fillStyle='#e08b47';ctx.beginPath();ctx.moveTo(1040,742);ctx.lineTo(1028,772);ctx.lineTo(1052,772);ctx.closePath();ctx.fill();for(const p of props){if(p.amount<=0)continue;let x=p.x,y=p.y,r=p.r;if(p.type==='tree'){ctx.fillStyle='rgba(25,35,24,.22)';ctx.beginPath();ctx.ellipse(x+5,y+12,r*.95,r*.45,0,0,6.28);ctx.fill();ctx.fillStyle='#6d4e35';ctx.fillRect(x-4,y,8,r*.8);ctx.fillStyle=p.flash?'#93c96d':'#476d43';ctx.beginPath();ctx.arc(x,y-r*.28,r,0,6.28);ctx.arc(x-r*.55,y-r*.05,r*.65,0,6.28);ctx.arc(x+r*.55,y-r*.05,r*.65,0,6.28);ctx.fill()}else if(p.type==='rock'){ctx.fillStyle=p.flash?'#c9cfbf':'#8b9488';ctx.beginPath();ctx.moveTo(x-r,y+r*.5);ctx.lineTo(x-r*.45,y-r*.8);ctx.lineTo(x+r*.45,y-r);ctx.lineTo(x+r,y+r*.4);ctx.lineTo(x+r*.15,y+r);ctx.closePath();ctx.fill()}else if(p.type==='berry'){ctx.fillStyle='#355f3d';ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();ctx.fillStyle=p.flash?'#ff8eb4':'#d65679';for(let a=0;a<6;a++){let q=a*1.05;ctx.beginPath();ctx.arc(x+Math.cos(q)*r*.65,y+Math.sin(q)*r*.55,3.2,0,6.28);ctx.fill()}}else{ctx.shadowColor='#55d9ff';ctx.shadowBlur=10;ctx.fillStyle=p.flash?'#e6fbff':'#67d9ed';ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r*.65,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r*.65,y);ctx.closePath();ctx.fill();ctx.shadowBlur=0}}for(const e of enemies){if(e.hp<=0)continue;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.ang);ctx.fillStyle='rgba(20,25,18,.22)';ctx.beginPath();ctx.ellipse(3,10,18,7,0,0,6.28);ctx.fill();ctx.fillStyle=e.hurt?'#cf7e65':'#6e5d4d';ctx.beginPath();ctx.ellipse(0,0,18,11,0,0,6.28);ctx.fill();ctx.fillStyle='#4b4037';ctx.beginPath();ctx.arc(15,-2,8,0,6.28);ctx.fill();ctx.restore()}for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.type==='crystal'?'#78e9ff':p.type==='berry'?'#e2698a':p.type==='hit'?'#d98872':'#c7bd8b';ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.dir);ctx.fillStyle='rgba(20,25,18,.25)';ctx.beginPath();ctx.ellipse(0,12,15,6,0,0,6.28);ctx.fill();ctx.fillStyle='#d7c4a0';ctx.beginPath();ctx.arc(0,-7,7,0,6.28);ctx.fill();ctx.fillStyle='#3e5960';ctx.fillRect(-7,0,14,18);ctx.fillStyle='#9b754a';ctx.fillRect(7,2,13,3);if(player.hit>0){ctx.strokeStyle='rgba(255,224,149,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(8,2,32,-.65,.55);ctx.stroke()}ctx.restore();ctx.restore()}requestAnimationFrame(update);
</script></body></html>
